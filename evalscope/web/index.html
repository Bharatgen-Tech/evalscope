<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/bharatgen-icon-32.png" />
    <link rel="apple-touch-icon" href="/bharatgen-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BharatGen</title>
    <script>
      // Apply theme before first paint to avoid FOUC.
      // Order: explicit user preference (localStorage) > OS preference (prefers-color-scheme) > dark.
      ;(function () {
        var saved = localStorage.getItem('evalscope-theme')
        var theme
        if (saved === 'light' || saved === 'dark') {
          theme = saved
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light'
        } else {
          theme = 'dark'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
